<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бубенко Виктория Сергеевна</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .avatar {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff9966, #ff5e62);
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    border: 3px solid rgba(255,255,255,0.4);
  }
  h1 { font-size: 26px; margin-bottom: 6px; }
  .role {
    color: #ffd166;
    font-size: 15px;
    letter-spacing: 0.5px;
    margin-bottom: 18px;
  }
  .about {
    font-size: 15px;
    line-height: 1.6;
    color: rgba(255,255,255,0.85);
    margin-bottom: 28px;
  }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .links a {
    display: block;
    padding: 13px;
    border-radius: 12px;
    text-decoration: none;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 15px;
    transition: background 0.2s, transform 0.15s;
  }
  .links a:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
  .footer { margin-top: 26px; font-size: 12px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">&#127946;</div>
    <h1>Бубенко Виктория Сергеевна</h1>
    <div class="role">Учитель физической культуры &middot; г. Макушино</div>
    <p class="about">Работаю учителем физической культуры. Увлекаюсь спортом и веду здоровый образ жизни. Спорт — это не просто работа, а часть моей жизни!</p>
    <div class="links">
      <a href="https://t.me/ваш_ник">&#9993;&nbsp; Написать в Telegram</a>
      <a href="mailto:ваша_почта@mail.ru">&#9997;&nbsp; Моя почта</a>
    </div>
    <div class="footer">&copy; 2026 Бубенко В. С.</div>
  </div>
</body>
</html>
